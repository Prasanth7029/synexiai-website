<body class="h-full text-[var(--text-color)] font-sans">
<!-- No-JS fallback with useful links (HashRouter-friendly) -->
<noscript>
    <style>
        .ns-card{max-width:720px;margin:2rem auto;padding:1rem;border:1px solid #e5e7eb;border-radius:12px;font:14px/1.5 system-ui;color:#111}
        .ns-links a{display:inline-block;margin:.25rem .5rem;color:#0369a1;text-decoration:none}
    </style>
    <div class="ns-card">
        <strong>SynexiAI</strong> — This site needs JavaScript. Quick links:
        <div class="ns-links" style="margin-top:.5rem">
            <a href="#/">Home</a>
            <a href="#/projects">Projects</a>
            <a href="#/portfolio">Portfolio</a>
            <a href="#/about">About</a>
            <a href="#/contact">Contact</a>
        </div>
    </div>
</noscript>

<div id="root"></div>

<!-- Boot theme before paint -->
<script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark'
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
</script>

<!-- Vite entry -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
