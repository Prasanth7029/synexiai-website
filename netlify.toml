# netlify.toml — Vite + Netlify Functions + Lighthouse v3

[build]
command   = "npm run build"
publish   = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[dev]
command       = "npm run dev"
targetPort    = 5173
port          = 8888
functionsPort = 9999

# SPA fallback (works in dev and prod)
[[redirects]]
from = "/*"
to   = "/index.html"
status = 200

# Long-cache for hashed assets
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Vary = "Accept-Encoding"

# Security headers (tweak CSP as needed)
[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; img-src 'self' data: https: *; frame-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https:; connect-src 'self' https: http://localhost:*;"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "interest-cohort=()"

# Run Lighthouse only on production deploys (v3 syntax)
[context.production]
[[context.production.plugins]]
package = "@netlify/plugin-lighthouse"
[context.production.plugins.inputs]
audits = [
    { path = "/" },
    { path = "/about" },
    { path = "/vision" }
]
thresholds = { performance = 0.90, accessibility = 0.90, "best-practices" = 0.90, seo = 0.90 }

# Function-specific includes
[functions."chat-assistant"]
included_files = ["netlify/functions/chat-assistant/knowledge/**"]
